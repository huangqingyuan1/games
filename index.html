<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小游戏</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #0f1117; color: #e8ecf6;
         font-family: "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
         display: flex; align-items: center; justify-content: center; }
  main { width: min(880px, 92vw); }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: 1px; }
  p.sub { color: #7c879c; font-size: 14px; margin: 0 0 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  a.card { display: block; border-radius: 16px; overflow: hidden; text-decoration: none;
           background: #171b26; border: 1px solid #232a3a; color: inherit; transition: .2s; }
  a.card:hover { transform: translateY(-3px); border-color: #4a5bff; box-shadow: 0 12px 30px rgba(74,91,255,.18); }
  .cover { aspect-ratio: 16/9; background: linear-gradient(135deg,#2b3a6b,#5b3a8a); display: flex;
           align-items: center; justify-content: center; font-size: 42px; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 12px 14px 16px; }
  .body h2 { font-size: 16px; margin: 0 0 6px; }
  .body span { font-size: 12.5px; color: #7c879c; }
</style>
</head>
<body>
<main>
  <h1>小游戏</h1>
  <p class="sub">全部由 Godot 4.5.1 制作，共用同一份引擎，只加载各自的游戏数据。</p>
  <div class="grid">
    <a class="card" href="fox-quest/">
      <div class="cover"><img src="covers/fox-quest.jpg" alt="狐狸闯关"></div>
      <div class="body"><h2>狐狸闯关 Fox Quest</h2><span>10 关 · 双 BOSS · 横版射击</span></div>
    </a>
    <a class="card" href="snake/">
      <div class="cover"><img src="covers/snake.jpg" alt="贪吃蛇"></div>
      <div class="body"><h2>贪吃蛇 Snake</h2><span>32×32 地图 · 穿墙 · 手机可玩</span></div>
    </a>
    <a class="card" href="minesweeper/">
      <div class="cover"><img src="covers/minesweeper.jpg" alt="扫雷"></div>
      <div class="body"><h2>扫雷 Minesweeper</h2><span>三档难度 · 涟漪翻开 · 手机可玩</span></div>
    </a>
  </div>
</main>
</body>
</html>
